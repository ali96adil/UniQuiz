name: CI

on:
  pull_request:
    paths-ignore:
      - "docs/**"
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.21.0

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.17.1 --activate

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Validate safe M7 rehearsal copier
        run: python3 -m unittest discover -s scripts -p "test_m7_rehearsal_copy.py" -v

      - name: Verify read-only historical migration fingerprints
        run: python3 -m unittest discover -s scripts -p "test_m7_rehearsal_verify.py" -v

      - name: Build
        run: pnpm build

      - name: Block premature answers on public HTTP and actual WebSocket connections
        run: node scripts/ci/m7-live-wire-secrecy-smoke.mjs

      - name: Verify migration preservation with actual M7 startup
        run: node scripts/ci/m7-migration-baseline-smoke.mjs

      - name: Upgrade real M6 schema fixture and preserve ranking
        run: node scripts/ci/m7-exact-m6-upgrade-smoke.mjs

      - name: Compare pre-upgrade M6 and post-upgrade M7 ranking exactly
        run: node scripts/ci/m7-m6-ranking-parity-smoke.mjs

      - name: Server, realtime and M2 persistence smoke test
        shell: bash
        env:
          UNIQUIZ_DB_PATH: /tmp/uniquiz-ci.db
          UNIQUIZ_OPERATOR_PASSWORD: ci-only-offline-operator-test-password
        run: |
          set -euo pipefail

          rm -f /tmp/uniquiz-ci.db /tmp/uniquiz-ci.db-shm /tmp/uniquiz-ci.db-wal
          rm -f /tmp/uniquiz-draw-before.json

          start_server() {
            pnpm --filter @uniquiz/server start > /tmp/uniquiz-server.log 2>&1 &
            SERVER_PID=$!

            for attempt in {1..20}; do
              if curl --fail --silent http://127.0.0.1:8787/health > /tmp/health.json; then
                return 0
              fi
              sleep 0.5
            done

            echo "Server failed to become healthy"
            cat /tmp/uniquiz-server.log || true
            return 1
          }

          cleanup() {
            kill "$SERVER_PID" 2>/dev/null || true
            wait "$SERVER_PID" 2>/dev/null || true
            cat /tmp/uniquiz-server.log || true
          }
          trap cleanup EXIT

          start_server

          curl --fail --show-error --silent http://127.0.0.1:8787/health
          echo

          pnpm --filter @uniquiz/web exec node --input-type=module -e '
            import { io } from "socket.io-client";

            const login = await fetch("http://127.0.0.1:8787/api/auth/login", {
              method: "POST",
              headers: { "content-type": "application/json" },
              body: JSON.stringify({
                password: process.env.UNIQUIZ_OPERATOR_PASSWORD,
              }),
            });
            if (!login.ok) throw new Error("CI operator login failed: " + login.status);
            const cookie = login.headers.get("set-cookie")?.split(";")[0];
            if (!cookie) throw new Error("Missing operator session cookie");

            // An unauthenticated client cannot become an operator by naming
            // the role. Team A can still connect with only its scoped token.
            const verifyRole = (requestedRole, token, expectedRole) =>
              new Promise((resolve, reject) => {
                const client = io("http://127.0.0.1:8787", {
                  auth: { role: requestedRole, token },
                  transports: ["websocket"],
                });
                const timeout = setTimeout(() => {
                  client.disconnect();
                  reject(new Error("Timed out verifying " + expectedRole));
                }, 5000);
                client.on("connect_error", (error) => {
                  clearTimeout(timeout);
                  client.disconnect();
                  reject(error);
                });
                client.on("server:hello", (payload) => {
                  clearTimeout(timeout);
                  client.disconnect();
                  payload.role === expectedRole ? resolve() :
                    reject(new Error("Unexpected role " + payload.role));
                });
              });
            await verifyRole("operator", null, "unknown");
            const credentialsResponse = await fetch(
              "http://127.0.0.1:8787/api/stations/credentials",
              { headers: { cookie } },
            );
            if (!credentialsResponse.ok) throw new Error("Team token access failed");
            const credentials = await credentialsResponse.json();
            await verifyRole("team-a", credentials.teamA.token, "team-a");

            // Real connection lifecycle: revoke A while A is online, ensure
            // server disconnects its existing socket immediately and old
            // bearer token can no longer authenticate on reconnection.
            const liveA = io("http://127.0.0.1:8787", {
              auth: { role: "team-a", token: credentials.teamA.token },
              transports: ["websocket"],
            });
            const connectedA = new Promise((resolve, reject) => {
              const timeout = setTimeout(() => reject(new Error("Station A did not connect")), 5000);
              liveA.once("server:hello", (payload) => {
                clearTimeout(timeout);
                payload.role === "team-a" ? resolve() : reject(new Error("Station A role mismatch"));
              });
              liveA.on("connect_error", reject);
            });
            await connectedA;
            const disconnectedA = new Promise((resolve, reject) => {
              const timeout = setTimeout(() => reject(new Error("Rotated station not disconnected")), 5000);
              liveA.once("disconnect", (reason) => {
                clearTimeout(timeout);
                reason === "io server disconnect" ? resolve() :
                  reject(new Error("Unexpected station disconnect: " + reason));
              });
            });
            const rotatedResponse = await fetch(
              "http://127.0.0.1:8787/api/stations/a/rotate",
              { method: "POST",
                headers: { cookie, "content-type": "application/json" },
                body: JSON.stringify({ confirm: "ROTATE_STATION_TOKEN" }),
              },
            );
            if (!rotatedResponse.ok) throw new Error("Cannot rotate CI station: " + rotatedResponse.status);
            const rotated = await rotatedResponse.json();
            await disconnectedA;
            await verifyRole("team-a", credentials.teamA.token, "unknown");
            await verifyRole("team-a", rotated.credential.token, "team-a");
            await verifyRole("team-b", credentials.teamB.token, "team-b");

            const socket = io("http://127.0.0.1:8787", {
              auth: { role: "operator" },
              extraHeaders: { cookie },
              transports: ["websocket"],
            });

            const fail = (error) => {
              console.error(error);
              socket.close();
              process.exit(1);
            };

            const timer = setTimeout(
              () => fail(new Error("Timed out waiting for initial workspace snapshot")),
              5000,
            );

            let receivedHello = false;
            let receivedWorkspace = false;
            const complete = () => {
              if (!receivedHello || !receivedWorkspace) return;
              clearTimeout(timer);
              console.log("Realtime hello + active workspace synchronized");
              socket.close();
              process.exit(0);
            };
            socket.on("connect_error", fail);
            socket.on("server:hello", (payload) => {
              if (payload.role !== "operator") {
                fail(new Error("Unexpected realtime role"));
                return;
              }
              receivedHello = true;
              complete();
            });
            socket.on("competition:workspaces", (items) => {
              if (!Array.isArray(items) ||
                  items.find((item) => item.active)?.id !== "legacy") {
                fail(new Error("New socket did not receive current active workspace"));
                return;
              }
              receivedWorkspace = true;
              complete();
            });
          '

          node scripts/ci/m2-persistence-smoke.mjs create

          kill "$SERVER_PID"
          wait "$SERVER_PID" || true

          start_server

          node scripts/ci/m2-persistence-smoke.mjs verify

          kill "$SERVER_PID"
          wait "$SERVER_PID" || true
          trap - EXIT
          cat /tmp/uniquiz-server.log
