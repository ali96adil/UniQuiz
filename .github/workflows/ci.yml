name: CI

on:
  pull_request:
    paths-ignore:
      - "docs/**"
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.21.0

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.17.1 --activate

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Validate safe M7 rehearsal copier
        run: python3 -m unittest discover -s scripts -p "test_m7_rehearsal_copy.py" -v

      - name: Build
        run: pnpm build

      - name: Server, realtime and M2 persistence smoke test
        shell: bash
        env:
          UNIQUIZ_DB_PATH: /tmp/uniquiz-ci.db
          # Synthetic CI-only secret, never use it for a real event.
          UNIQUIZ_OPERATOR_PASSPHRASE: CI_ONLY_TEST_PASSPHRASE_NEVER_USE_IN_PRODUCTION
        run: |
          set -euo pipefail

          rm -f /tmp/uniquiz-ci.db /tmp/uniquiz-ci.db-shm /tmp/uniquiz-ci.db-wal
          rm -f /tmp/uniquiz-draw-before.json

          start_server() {
            pnpm --filter @uniquiz/server start > /tmp/uniquiz-server.log 2>&1 &
            SERVER_PID=$!

            for attempt in {1..20}; do
              if curl --fail --silent http://127.0.0.1:8787/health > /tmp/health.json; then
                return 0
              fi
              sleep 0.5
            done

            echo "Server failed to become healthy"
            cat /tmp/uniquiz-server.log || true
            return 1
          }

          cleanup() {
            kill "$SERVER_PID" 2>/dev/null || true
            wait "$SERVER_PID" 2>/dev/null || true
            cat /tmp/uniquiz-server.log || true
          }
          trap cleanup EXIT

          start_server

          curl --fail --show-error --silent http://127.0.0.1:8787/health
          echo

          pnpm --filter @uniquiz/web exec node --input-type=module -e '
            import { io } from "socket.io-client";

            const rejectedOperator = io("http://127.0.0.1:8787", {
              auth: { role: "operator" },
              transports: ["websocket"],
              reconnection: false,
            });
            await new Promise((resolve, reject) => {
              const timer = setTimeout(() => reject(new Error("Unauthenticated operator was not rejected")), 5000);
              rejectedOperator.on("connect", () => {
                clearTimeout(timer);
                rejectedOperator.close();
                reject(new Error("Unauthenticated operator socket was accepted"));
              });
              rejectedOperator.on("connect_error", (error) => {
                clearTimeout(timer);
                rejectedOperator.close();
                if (error.message !== "OPERATOR_AUTH_REQUIRED") return reject(error);
                resolve();
              });
            });

            const rejectedTeam = io("http://127.0.0.1:8787", {
              auth: { role: "team-a", token: "fake-unauthorized-token" },
              transports: ["websocket"],
              reconnection: false,
            });
            await new Promise((resolve, reject) => {
              const timer = setTimeout(() => reject(new Error("Invalid team token was not rejected")), 5000);
              rejectedTeam.on("connect", () => {
                clearTimeout(timer);
                rejectedTeam.close();
                reject(new Error("Untrusted team socket was accepted"));
              });
              rejectedTeam.on("connect_error", (error) => {
                clearTimeout(timer);
                rejectedTeam.close();
                if (error.message !== "STATION_AUTH_REQUIRED") return reject(error);
                resolve();
              });
            });

            const login = await fetch("http://127.0.0.1:8787/api/auth/login", {
              method: "POST",
              headers: { "content-type": "application/json" },
              body: JSON.stringify({ passphrase: process.env.UNIQUIZ_OPERATOR_PASSPHRASE }),
            });
            if (!login.ok) throw new Error("CI operator login failed");
            const session = login.headers.get("set-cookie")?.split(";")[0];
            if (!session) throw new Error("Missing auth cookie");
            const socket = io("http://127.0.0.1:8787", {
              auth: { role: "operator" },
              extraHeaders: { cookie: session },
              transports: ["websocket"],
              reconnection: false,
            });

            const fail = (error) => {
              console.error(error);
              socket.close();
              process.exit(1);
            };

            const timer = setTimeout(
              () => fail(new Error("Timed out waiting for server:hello")),
              5000,
            );

            socket.on("connect_error", fail);
            socket.on("server:hello", (payload) => {
              clearTimeout(timer);
              if (payload.role !== "operator") {
                fail(new Error("Unexpected realtime role"));
                return;
              }
              console.log("Realtime hello:", payload.role);
              void (async () => {
                const disconnected = new Promise((resolve, reject) => {
                  const killTimer = setTimeout(
                    () => reject(new Error("Operator socket survived logout")),
                    5000,
                  );
                  socket.once("disconnect", () => {
                    clearTimeout(killTimer);
                    resolve();
                  });
                });
                const logout = await fetch("http://127.0.0.1:8787/api/auth/logout", {
                  method: "POST",
                  headers: { cookie: session },
                });
                if (!logout.ok) throw new Error("Operator logout failed");
                await disconnected;
                const revoked = await fetch("http://127.0.0.1:8787/api/stations/credentials", {
                  headers: { cookie: session },
                });
                if (revoked.status !== 401) throw new Error("Logout cookie still authorized");
                console.log("Operator socket disconnected on logout; HTTP access revoked");
                socket.close();
                process.exit(0);
              })().catch(fail);
            });
          '

          node scripts/ci/m2-persistence-smoke.mjs create

          kill "$SERVER_PID"
          wait "$SERVER_PID" || true

          start_server

          node scripts/ci/m2-persistence-smoke.mjs verify

          kill "$SERVER_PID"
          wait "$SERVER_PID" || true
          trap - EXIT
          cat /tmp/uniquiz-server.log
