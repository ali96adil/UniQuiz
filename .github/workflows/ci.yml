name: CI

on:
  pull_request:
    paths-ignore:
      - "docs/**"
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.21.0

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.17.1 --activate

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Server, realtime and M2 persistence smoke test
        shell: bash
        env:
          UNIQUIZ_DB_PATH: /tmp/uniquiz-ci.db
        run: |
          set -euo pipefail

          rm -f /tmp/uniquiz-ci.db /tmp/uniquiz-ci.db-shm /tmp/uniquiz-ci.db-wal

          start_server() {
            pnpm --filter @uniquiz/server start > /tmp/uniquiz-server.log 2>&1 &
            SERVER_PID=$!

            for attempt in {1..20}; do
              if curl --fail --silent http://127.0.0.1:8787/health > /tmp/health.json; then
                return 0
              fi
              sleep 0.5
            done

            echo "Server failed to become healthy"
            return 1
          }

          start_server

          cleanup() {
            kill "$SERVER_PID" 2>/dev/null || true
            wait "$SERVER_PID" 2>/dev/null || true
            cat /tmp/uniquiz-server.log || true
          }
          trap cleanup EXIT

          curl --fail --show-error --silent http://127.0.0.1:8787/health
          echo

          pnpm --filter @uniquiz/web exec node --input-type=module -e '
            import { io } from "socket.io-client";

            const socket = io("http://127.0.0.1:8787", {
              auth: { role: "operator" },
              transports: ["websocket"],
            });

            const fail = (error) => {
              console.error(error);
              socket.close();
              process.exit(1);
            };

            const timer = setTimeout(
              () => fail(new Error("Timed out waiting for server:hello")),
              5000,
            );

            socket.on("connect_error", fail);
            socket.on("server:hello", (payload) => {
              clearTimeout(timer);

              if (payload.role !== "operator") {
                fail(new Error("Unexpected realtime role"));
                return;
              }

              console.log("Realtime hello:", payload.role);
              socket.close();
              process.exit(0);
            });
          '

          node --input-type=module <<'NODE'
          const base = "http://127.0.0.1:8787";

          async function request(path, method = "GET", body) {
            const response = await fetch(base + path, {
              method,
              headers: body ? { "content-type": "application/json" } : undefined,
              body: body ? JSON.stringify(body) : undefined,
            });

            const payload = await response.json();
            if (!response.ok) {
              throw new Error(`${method} ${path}: ${response.status} ${JSON.stringify(payload)}`);
            }
            return payload;
          }

          const setup = await request("/api/setup/colleges", "PUT", {
            colleges: [
              { name: "College 1" },
              { name: "College 2" },
              { name: "College 3" },
              { name: "College 4" },
              { name: "College 5" },
            ],
          });

          const collegeIds = setup.colleges.map((college) => college.id);
          await request("/api/setup/participants", "PUT", { collegeIds });
          await request("/api/setup/participants/lock", "POST", {});
          const draw = await request("/api/draw", "POST", {});

          if (draw.rounds.length !== 3) {
            throw new Error("Expected exactly three rounds for five colleges");
          }

          if (draw.rounds.at(-1)?.collegeB !== null) {
            throw new Error("Expected solo round to be last");
          }

          const appearances = draw.rounds.flatMap((round) => [
            round.collegeA.id,
            ...(round.collegeB ? [round.collegeB.id] : []),
          ]);

          if (
            appearances.length !== 5 ||
            new Set(appearances).size !== 5
          ) {
            throw new Error("Every participant must appear exactly once");
          }

          await import("node:fs").then(({ writeFileSync }) => {
            writeFileSync(
              "/tmp/uniquiz-draw-before.json",
              JSON.stringify(draw.rounds),
            );
          });

          console.log("M2 draw created and validated");
NODE

          kill "$SERVER_PID"
          wait "$SERVER_PID" || true

          start_server

          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";

          const response = await fetch("http://127.0.0.1:8787/api/draw");
          if (!response.ok) {
            throw new Error(`GET /api/draw failed: ${response.status}`);
          }

          const after = await response.json();
          const before = JSON.parse(
            readFileSync("/tmp/uniquiz-draw-before.json", "utf8"),
          );

          if (JSON.stringify(after.rounds) !== JSON.stringify(before)) {
            throw new Error("Official draw changed after server restart");
          }

          console.log("M2 draw persistence verified after restart");
NODE

          kill "$SERVER_PID"
          wait "$SERVER_PID" || true
          trap - EXIT
          cat /tmp/uniquiz-server.log
