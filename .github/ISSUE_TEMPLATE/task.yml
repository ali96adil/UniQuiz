name: Implementation task
description: Track one focused UniQuiz implementation task
title: "[Task] "
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What single outcome should this task deliver?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: Concrete work included in this task.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Observable conditions required before the task is Done.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification
      description: Tests or manual checks required.
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies / blockers
      description: Related issue, PR, device or prerequisite. Write None if there are none.
    validations:
      required: true
